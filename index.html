<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>体育档案查看</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main style="margin:0;max-width:960px">
    <header><div><p class="eyebrow">只读查看</p><h1>体育课程档案</h1></div></header>
    <section class="card" id="unlock"><h2>输入查看密码</h2><p class="muted">数据为加密查看快照，仅供教师本人使用。</p><input id="password" type="password" placeholder="查看密码" /><div class="actions"><button class="primary" id="unlock-btn">打开档案</button></div><p id="unlock-msg" class="muted"></p></section>
    <section id="viewer" class="hidden"><div class="toolbar"><input id="q" placeholder="搜索姓名、班级或年级" /></div><div class="card table-card"><table><thead><tr><th>姓名</th><th>年级 / 班级</th><th>课程</th><th>项目</th><th>总评</th><th>评价</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
